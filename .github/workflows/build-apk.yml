name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test the maths and build the APK
        run: |
          set -o pipefail
          gradle testReleaseUnitTest assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Show what went wrong
        if: failure()
        run: |
          msg=$( { grep -E "^e: " build.log; grep -A6 "What went wrong" build.log; grep -B1 -A4 " FAILED$" build.log; } | head -60 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Build failed::${msg}"

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk Sigma-Calculator.apk

      - name: Save the APK with this build
        uses: actions/upload-artifact@v4
        with:
          name: Sigma-Calculator-apk
          path: Sigma-Calculator.apk

      - name: Publish a download on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Sigma Calculator 2.0.${{ github.run_number }} (Kotlin)
          files: Sigma-Calculator.apk
          body: |
            Open this page on your Android phone, tap **Sigma-Calculator.apk** to download it, then open the file to install.
            If your phone asks, allow your browser or Files app to install unknown apps.

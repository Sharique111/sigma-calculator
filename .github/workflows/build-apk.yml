name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk Sigma-Calculator.apk

      - name: Save the APK with this build
        uses: actions/upload-artifact@v4
        with:
          name: Sigma-Calculator-apk
          path: Sigma-Calculator.apk

      - name: Publish a download on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Sigma Calculator 1.0.${{ github.run_number }}
          files: Sigma-Calculator.apk
          body: |
            Open this page on your Android phone, tap **Sigma-Calculator.apk** to download it, then open the file to install.
            If your phone asks, allow your browser or Files app to install unknown apps.

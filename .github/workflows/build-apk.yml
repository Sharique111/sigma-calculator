name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write   # lets GitHub prove its identity to Google (no key file needed)

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_UPLOAD_KEY: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Test the maths and build the APK
        run: |
          set -o pipefail
          gradle testReleaseUnitTest assembleRelease --no-daemon 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk Sigma-Calculator.apk

      # ---- Google Play (runs once the upload key secrets are added) ----

      - name: Build the Google Play bundle
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export UPLOAD_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          gradle bundleRelease -PplayUpload --no-daemon 2>&1 | tee -a build.log
          cp app/build/outputs/bundle/release/app-release.aab Sigma-Calculator-GooglePlay.aab
          rm -f "$RUNNER_TEMP/upload.jks"

      # ---- Report and publish ----

      - name: Show what went wrong
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          msg=$( { grep -E "^e: " build.log; grep -A6 "What went wrong" build.log; grep -B1 -A4 " FAILED$" build.log; } | head -60 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Build failed::${msg}"

      - name: Publish downloads on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Sigma Calculator 2.0.${{ github.run_number }}
          files: |
            Sigma-Calculator.apk
            Sigma-Calculator-GooglePlay.aab
          fail_on_unmatched_files: false
          body: |
            **Sigma-Calculator.apk**: open this on your Android phone to install it directly.
            **Sigma-Calculator-GooglePlay.aab**: the file for Google Play Console (not installable on a phone).

      # ---- Upload to Google Play (after the files are safely on the Releases page) ----

      - name: Sign in to Google (keyless, Workload Identity Federation)
        id: google
        if: env.HAS_UPLOAD_KEY == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1028903667508/locations/global/workloadIdentityPools/github/providers/sigma-repo
          service_account: github-upload@sigma-play.iam.gserviceaccount.com

      - name: Upload to Google Play (internal testing)
        if: env.HAS_UPLOAD_KEY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ steps.google.outputs.credentials_file_path }}
          packageName: app.sigma.calculator
          releaseFiles: Sigma-Calculator-GooglePlay.aab
          tracks: internal
          status: completed
          mappingFile: app/build/outputs/mapping/release/mapping.txt

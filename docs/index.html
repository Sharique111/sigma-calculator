<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sigma Calculator</title>
<meta name="description" content="Sigma, a scientific calculator for Android by Stars&amp;Rockets.">
<style>
  :root { --bg:#EDF0F5; --card:#FFFFFF; --fg:#141A24; --muted:#5D6778; --line:#DCE2EA; --accent:#2F5BD3; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0D1117; --card:#151A22; --fg:#E7EBF1; --muted:#8C96A6; --line:#28303D; --accent:#7097FF; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:48px 16px; }
  main { max-width:560px; margin:0 auto; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:32px 28px; text-align:center; }
  .mark { width:64px; height:64px; border-radius:18px; background:var(--accent); color:#fff; display:grid; place-items:center; font:500 36px ui-monospace,Menlo,monospace; margin:0 auto 16px; }
  h1 { margin:0 0 6px; font-size:28px; }
  p { color:var(--muted); margin:0 0 20px; }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <div class="mark">σ</div>
  <h1>Sigma Calculator</h1>
  <p>A clean scientific calculator for Android with live preview, history, and degrees or radians. No ads, no tracking, works offline.</p>
  <p><a href="privacy-policy.html">Privacy policy</a> · Contact: <a href="mailto:sharikdon@gmail.com">sharikdon@gmail.com</a></p>
  <p style="font-size:13px">by Stars&amp;Rockets</p>
</main>
</body>
</html>

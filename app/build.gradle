plugins {
    id 'com.android.application'
}

// Each GitHub build gets a higher version number, so new APKs install over old ones.
def buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as Integer

android {
    namespace 'app.sigma.calculator'
    compileSdk 35

    defaultConfig {
        applicationId "app.sigma.calculator"
        minSdk 24
        targetSdk 35
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    signingConfigs {
        sigma {
            storeFile file("../keystore/sigma.keystore")
            storePassword "sigmacalc"
            keyAlias "sigma"
            keyPassword "sigmacalc"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.sigma
        }
        debug {
            signingConfig signingConfigs.sigma
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

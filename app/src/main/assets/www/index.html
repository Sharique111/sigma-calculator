<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sigma Calculator</title>
<meta name="description" content="Sigma, a scientific calculator with history and keyboard support.">
<link rel="stylesheet" href="fonts.css">
<style>
/* Layout: calculator card + history panel side by side on wide screens, stacked on phones */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --key:#F3F5F9; --key-fn:#E4E9F1; --key-hover:#E9EDF4;
  --fg:#141A24; --muted:#5D6778; --line:#DCE2EA;
  --accent:#2F5BD3; --accent-hover:#284FBA; --accent-fg:#FFFFFF; --accent-soft:#E3EAFB;
  --danger:#B8323A;
  --shadow:0 1px 2px rgba(20,26,36,.06),0 12px 32px rgba(20,26,36,.08);
  --font-ui:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1117; --surface:#151A22; --key:#1C232D; --key-fn:#232C39; --key-hover:#2A3442;
  --fg:#E7EBF1; --muted:#8C96A6; --line:#28303D;
  --accent:#7097FF; --accent-hover:#86A8FF; --accent-fg:#0A1020; --accent-soft:#1E2A47;
  --danger:#FF8086; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1117; --surface:#151A22; --key:#1C232D; --key-fn:#232C39; --key-hover:#2A3442;
  --fg:#E7EBF1; --muted:#8C96A6; --line:#28303D;
  --accent:#7097FF; --accent-hover:#86A8FF; --accent-fg:#0A1020; --accent-soft:#1E2A47;
  --danger:#FF8086; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:15px;padding-inline:16px;padding-block:24px 40px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.01em}
.mark{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--font-num);font-size:18px;font-weight:500}
.head-actions{display:flex;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 12px var(--font-ui);letter-spacing:.06em;text-transform:uppercase;padding:8px 12px;border-radius:999px;cursor:pointer}
.chip:hover{background:var(--key-hover)}
.chip:focus-visible,.key:focus-visible,.hist-item:focus-visible,.link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px;align-items:start}
@media (max-width:700px){.layout{grid-template-columns:minmax(0,1fr)}}
.calc{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.screen{background:var(--bg);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-height:118px;justify-content:flex-end;min-width:0}
.screen-top{display:flex;justify-content:space-between;width:100%;gap:12px;font-size:13px;color:var(--muted)}
.mode-tag{font:600 11px var(--font-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:6px}
.sub{font-family:var(--font-num);text-align:right;overflow-x:auto;white-space:nowrap;max-width:100%;min-height:1.3em}
.sub.err{color:var(--danger);font-family:var(--font-ui);font-weight:500}
.main{font-family:var(--font-num);font-size:38px;line-height:1.2;width:100%;text-align:right;overflow-x:auto;white-space:nowrap;scrollbar-width:none;font-variant-numeric:tabular-nums}
.main::-webkit-scrollbar{display:none}
.main.m{font-size:30px}.main.s{font-size:23px}
.main .ph{color:var(--muted)}
.keys{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.key{border:0;border-radius:12px;background:var(--key);color:var(--fg);font:500 18px var(--font-ui);height:54px;cursor:pointer;transition:background .12s,transform .06s;user-select:none;-webkit-tap-highlight-color:transparent}
.key:hover{background:var(--key-hover)}
.key:active,.key.pressed{transform:scale(.96)}
.key.fn{background:var(--key-fn);font-size:15px;height:44px}
.key.fn:hover{background:var(--key-hover)}
.key.num{font-family:var(--font-num);font-size:20px}
.key.op{color:var(--accent);font-size:22px;font-weight:600}
.key.clear{color:var(--danger);font-weight:600}
.key.eq{background:var(--accent);color:var(--accent-fg);font-size:24px}
.key.eq:hover{background:var(--accent-hover)}
.key.wide{grid-column:span 2}
.key sup{font-size:.65em}
.key.mode{font-size:12px;letter-spacing:.06em;font-weight:700;color:var(--accent)}
.hint{font-size:12px;color:var(--muted);line-height:1.5}
.hint kbd{font-family:var(--font-num);font-size:11px;background:var(--key-fn);border-radius:4px;padding:1px 5px}
@media (hover:none){.hint{display:none}}
.history{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;max-height:620px;min-width:0}
.history h2{margin:0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hist-head{display:flex;justify-content:space-between;align-items:center}
.link{background:none;border:0;color:var(--accent);font:600 13px var(--font-ui);cursor:pointer;padding:4px}
.hist-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;overflow-y:auto;min-height:0}
.hist-item{width:100%;text-align:right;background:var(--key);border:0;border-radius:10px;padding:10px 12px;cursor:pointer;color:var(--fg);display:flex;flex-direction:column;gap:2px;min-width:0}
.hist-item:hover{background:var(--key-hover)}
.hist-item .e{font-family:var(--font-num);font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.hist-item .r{font-family:var(--font-num);font-size:17px;overflow-wrap:anywhere}
.empty{color:var(--muted);font-size:14px;line-height:1.5;padding:8px 0}
@media (max-width:700px){.history{max-height:360px}}
@media (max-width:380px){.key{height:48px;font-size:16px}.key.fn{height:40px;font-size:13px}.keys{gap:6px}.main{font-size:32px}}
@media (prefers-reduced-motion:reduce){.key{transition:none}.key:active,.key.pressed{transform:none}}
</style>
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0;-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand"><span class="mark">σ</span>Sigma</div>
    <div class="head-actions">
      <button class="chip" id="themeBtn" type="button">Dark mode</button>
    </div>
  </header>

  <div class="layout">
    <section class="calc" aria-label="Calculator">
      <div class="screen">
        <div class="screen-top">
          <span class="mode-tag" id="modeTag">DEG</span>
          <div class="sub" id="sub" aria-live="polite"></div>
        </div>
        <div class="main" id="main"></div>
      </div>
      <div class="keys" id="keys"></div>
      <p class="hint">Keyboard: type numbers and <kbd>+ − * / ^ ( ) ! %</kbd>, <kbd>Enter</kbd> to calculate, <kbd>Backspace</kbd> to delete, <kbd>Esc</kbd> to clear. Shortcuts: <kbd>s</kbd> sin, <kbd>c</kbd> cos, <kbd>t</kbd> tan, <kbd>l</kbd> ln, <kbd>g</kbd> log, <kbd>r</kbd> √, <kbd>p</kbd> π, <kbd>a</kbd> Ans, <kbd>d</kbd> DEG/RAD.</p>
    </section>

    <aside class="history" aria-label="History">
      <div class="hist-head">
        <h2>History</h2>
        <button class="link" id="clearHist" type="button">Clear</button>
      </div>
      <ul class="hist-list" id="histList"></ul>
      <p class="empty" id="histEmpty">Your calculations will appear here. Tap one to use it again.</p>
    </aside>
  </div>
</div>

<script>
(function(){
  // ---------- storage helpers ----------
  const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
               set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

  // ---------- state ----------
  let expr='2×(3+4)^2';   // example expression to show how it works
  let deg=store.get('sigma.deg',true);
  let ans=0, evaluated=false, resultText='', errorText='';
  let history=store.get('sigma.history',[]);
  if(!Array.isArray(history)) history=[];

  // ---------- math engine (no eval) ----------
  const FUNCS={sin:1,cos:1,tan:1,ln:1,log:1};
  function tokenize(s){
    const t=[];let i=0;
    const ops={'+':'+','-':'-','−':'-','*':'*','×':'*','/':'/','÷':'/','^':'^','!':'!','%':'%','(':'(',')':')'};
    while(i<s.length){
      const c=s[i];
      if(c===' '){i++;continue}
      if(/[0-9.]/.test(c)){let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;
        const str=s.slice(i,j);
        if(str==='.'||(str.match(/\./g)||[]).length>1) throw new Error('Check the decimal point');
        t.push({type:'num',v:parseFloat(str)});i=j;continue}
      if(/[a-zA-Z]/.test(c)){let j=i;while(j<s.length&&/[a-zA-Z]/.test(s[j]))j++;
        const w=s.slice(i,j);
        if(FUNCS[w]) t.push({type:'fn',v:w});
        else if(w==='e') t.push({type:'num',v:Math.E});
        else if(w==='Ans') t.push({type:'ans'});
        else throw new Error('Unknown name “'+w+'”');
        i=j;continue}
      if(c==='π'){t.push({type:'num',v:Math.PI});i++;continue}
      if(c==='√'){t.push({type:'fn',v:'sqrt'});i++;continue}
      if(ops[c]){t.push({type:'op',v:ops[c]});i++;continue}
      throw new Error('Unknown symbol “'+c+'”');
    }
    return t;
  }
  function fact(n){
    if(n<0||!Number.isInteger(n)) throw new Error('Factorial needs a whole number, 0 or more');
    if(n>170) throw new Error('That number is too large');
    let r=1;for(let i=2;i<=n;i++)r*=i;return r;
  }
  function applyFn(f,a){
    const toRad=x=>deg?x*Math.PI/180:x;
    let r;
    switch(f){
      case 'sin': r=Math.sin(toRad(a)); break;
      case 'cos': r=Math.cos(toRad(a)); break;
      case 'tan': {
        if(deg && Math.abs(((a%180)+180)%180-90)<1e-12) throw new Error('tan is undefined at that angle');
        r=Math.tan(toRad(a)); break;}
      case 'ln': if(a<=0) throw new Error('ln needs a number above 0'); r=Math.log(a); break;
      case 'log': if(a<=0) throw new Error('log needs a number above 0'); r=Math.log10(a); break;
      case 'sqrt': if(a<0) throw new Error('Square root needs a number 0 or more'); r=Math.sqrt(a); break;
    }
    if(['sin','cos','tan'].includes(f)&&Math.abs(r)<1e-12) r=0;
    return r;
  }
  function evaluate(src){
    const t=tokenize(src);let p=0;
    if(!t.length) throw new Error('Enter a calculation');
    const isOp=v=>t[p]&&t[p].type==='op'&&t[p].v===v;
    const starts=()=>{const k=t[p];return k&&(k.type==='num'||k.type==='fn'||k.type==='ans'||(k.type==='op'&&k.v==='('))};
    function expr_(){let v=term();while(isOp('+')||isOp('-')){const o=t[p++].v;const r=term();v=o==='+'?v+r:v-r}return v}
    function term(){let v=unary();for(;;){
      if(isOp('*')){p++;v*=unary()}
      else if(isOp('/')){p++;const r=unary();if(r===0)throw new Error("Can't divide by zero");v/=r}
      else if(starts()){v*=unary()}   // implicit multiplication: 2π, 3(4), (1)(2)
      else break}return v}
    function unary(){if(isOp('-')){p++;return -unary()}if(isOp('+')){p++;return unary()}return power()}
    function power(){const b=postfix();if(isOp('^')){p++;return Math.pow(b,unary())}return b}
    function postfix(){let v=primary();for(;;){if(isOp('!')){p++;v=fact(v)}else if(isOp('%')){p++;v/=100}else break}return v}
    function close(){if(isOp(')'))p++;else if(p<t.length)throw new Error('Missing a closing bracket')}
    function primary(){
      const k=t[p];if(!k)throw new Error('Finish the calculation');
      if(k.type==='num'){p++;return k.v}
      if(k.type==='ans'){p++;return ans}
      if(k.type==='fn'){p++;let a;if(isOp('(')){p++;a=expr_();close()}else a=unary();return applyFn(k.v,a)}
      if(isOp('(')){p++;const v=expr_();close();return v}
      throw new Error('Unexpected “'+(k.v==='*'?'×':k.v==='/'?'÷':k.v==='-'?'−':k.v)+'”');
    }
    const v=expr_();
    if(p<t.length) throw new Error('Unexpected “'+t[p].v+'”');
    if(!Number.isFinite(v)) throw new Error('Result is too large');
    return v;
  }
  function fmt(v){
    if(Object.is(v,-0)) v=0;
    const a=Math.abs(v);
    let s;
    if(a!==0&&(a>=1e15||a<1e-9)){
      s=v.toExponential(9).replace(/\.?0+e/,'e').replace('e+','e');
    } else {
      s=String(parseFloat(v.toPrecision(12)));
      if(s.includes('e')) s=v.toExponential(9).replace(/\.?0+e/,'e').replace('e+','e');
      else {const [i,d]=s.split('.');s=i.replace(/\B(?=(\d{3})+(?!\d))/g,',')+(d?'.'+d:'')}
    }
    return s.replace(/^-/,'−');
  }

  // ---------- input ----------
  const BIN=['+','−','×','÷','^'];
  const MULTI=['sin(','cos(','tan(','ln(','log(','√(','Ans'];
  function startFresh(){ if(evaluated){expr='';evaluated=false} errorText=''; }
  function continueFromAns(){ if(evaluated){expr='Ans';evaluated=false} errorText=''; }

  function press(k){
    switch(k){
      case 'AC': expr='';evaluated=false;errorText='';break;
      case 'DEL':
        if(evaluated){expr='';evaluated=false;errorText='';break}
        errorText='';
        {const m=MULTI.find(x=>expr.endsWith(x));expr=m?expr.slice(0,-m.length):expr.slice(0,-1)}
        break;
      case 'MODE': deg=!deg;store.set('sigma.deg',deg);break;
      case '=': calculate();return;
      case '+':case '×':case '÷':case '^':
        continueFromAns();
        if(expr===''&&k!=='+'){expr='Ans'}
        if(BIN.includes(expr.slice(-1))) expr=expr.slice(0,-1);
        expr+=k;break;
      case '−':
        continueFromAns();
        if(expr.endsWith('−')||expr.endsWith('+')) expr=expr.slice(0,-1);
        expr+='−';break;
      case '!':case '%':case 'SQ':
        continueFromAns();
        if(expr==='') expr='Ans';
        expr+= k==='SQ'?'^2':k;break;
      default:
        startFresh();expr+=k;
    }
    render();
  }

  function calculate(){
    if(evaluated) return;
    if(expr.trim()===''){return}
    try{
      const v=evaluate(expr);
      // auto-close open brackets for the record
      const open=(expr.match(/\(/g)||[]).length-(expr.match(/\)/g)||[]).length;
      const shown=expr+')'.repeat(Math.max(0,open));
      ans=v;resultText=fmt(v);evaluated=true;errorText='';
      expr=shown;
      history.unshift({e:shown,r:resultText,d:deg});
      history=history.slice(0,50);store.set('sigma.history',history);
      renderHistory();
    }catch(err){errorText=err.message}
    render();
  }

  // ---------- rendering ----------
  const mainEl=document.getElementById('main'), subEl=document.getElementById('sub'), modeTag=document.getElementById('modeTag');
  function render(){
    modeTag.textContent=deg?'DEG':'RAD';
    const modeKey=document.querySelector('[data-k="MODE"]');if(modeKey) modeKey.textContent=deg?'DEG':'RAD';
    let mainText,sub='';subEl.classList.remove('err');
    if(evaluated){mainText=resultText;sub=expr+' ='}
    else{
      mainText=expr;
      if(errorText){sub=errorText;subEl.classList.add('err')}
      else if(expr){try{const v=evaluate(expr);const f=fmt(v);if(f!==expr.replace(/^-/,'−'))sub='= '+f}catch(e){}}
    }
    subEl.textContent=sub;
    if(mainText){mainEl.textContent=mainText}else{mainEl.innerHTML='<span class="ph">0</span>'}
    const len=mainText.length;
    mainEl.classList.toggle('m',len>13&&len<=20);
    mainEl.classList.toggle('s',len>20);
    mainEl.scrollLeft=mainEl.scrollWidth;subEl.scrollLeft=subEl.scrollWidth;
  }

  const histList=document.getElementById('histList'), histEmpty=document.getElementById('histEmpty');
  function renderHistory(){
    histList.innerHTML='';
    histEmpty.hidden=history.length>0;
    document.getElementById('clearHist').hidden=history.length===0;
    history.forEach(h=>{
      const li=document.createElement('li');
      const b=document.createElement('button');b.type='button';b.className='hist-item';
      b.setAttribute('aria-label','Use '+h.e+' equals '+h.r);
      const e=document.createElement('span');e.className='e';e.textContent=h.e+' ='+(h.d===false?' (RAD)':'');
      const r=document.createElement('span');r.className='r';r.textContent=h.r;
      b.append(e,r);
      b.addEventListener('click',()=>{expr=h.e;evaluated=false;errorText='';render()});
      li.append(b);histList.append(li);
    });
  }
  document.getElementById('clearHist').addEventListener('click',()=>{history=[];store.set('sigma.history',history);renderHistory()});

  // ---------- keypad ----------
  const KEYS=[
    ['MODE','DEG','fn mode','Switch between degrees and radians'],['sin(','sin','fn'],['cos(','cos','fn'],['tan(','tan','fn'],['π','π','fn','Pi'],
    ['ln(','ln','fn'],['log(','log','fn'],['√(','√','fn','Square root'],['SQ','x<sup>2</sup>','fn','Square'],['^','x<sup>y</sup>','fn','Power'],
    ['AC','AC','clear','Clear all'],['DEL','⌫','clear','Delete'],['(','(','fn'],[')',')','fn'],['÷','÷','op','Divide'],
    ['7','7','num'],['8','8','num'],['9','9','num'],['!','n!','fn','Factorial'],['×','×','op','Multiply'],
    ['4','4','num'],['5','5','num'],['6','6','num'],['%','%','fn','Percent'],['−','−','op','Subtract'],
    ['1','1','num'],['2','2','num'],['3','3','num'],['e','e','fn',"Euler's number"],['+','+','op','Add'],
    ['0','0','num wide'],['.','.','num','Decimal point'],['Ans','Ans','fn','Previous answer'],['=','=','eq','Equals']
  ];
  const keysEl=document.getElementById('keys');
  KEYS.forEach(([k,label,cls,aria])=>{
    const b=document.createElement('button');b.type='button';b.className='key '+cls;b.innerHTML=label;b.dataset.k=k;
    if(aria) b.setAttribute('aria-label',aria);
    b.addEventListener('click',()=>press(k));
    keysEl.append(b);
  });

  // ---------- keyboard ----------
  const KB={'+':'+','-':'−','*':'×','x':'×','/':'÷','^':'^','(':'(',')':')','!':'!','%':'%','.':'.',',':'.',
            'Enter':'=','=':'=','Backspace':'DEL','Escape':'AC','Delete':'AC',
            's':'sin(','c':'cos(','t':'tan(','l':'ln(','g':'log(','r':'√(','p':'π','e':'e','a':'Ans','d':'MODE'};
  document.addEventListener('keydown',ev=>{
    if(ev.ctrlKey||ev.metaKey||ev.altKey) return;
    let k=/^[0-9]$/.test(ev.key)?ev.key:KB[ev.key];
    if(!k) return;
    if(ev.key==='Enter'&&document.activeElement&&document.activeElement.matches('button')&&document.activeElement.dataset.k!=null) {document.activeElement.blur()}
    ev.preventDefault();
    press(k);
    const btn=keysEl.querySelector('[data-k="'+CSS.escape(k)+'"]');
    if(btn){btn.classList.add('pressed');setTimeout(()=>btn.classList.remove('pressed'),110)}
  });

  // ---------- theme ----------
  const root=document.documentElement, themeBtn=document.getElementById('themeBtn');
  const mq=window.matchMedia('(prefers-color-scheme: dark)');
  const saved=store.get('sigma.theme',null);
  if(saved==='dark'||saved==='light') root.setAttribute('data-theme',saved);
  const isDark=()=>{const t=root.getAttribute('data-theme');return t?t==='dark':mq.matches};
  function syncThemeBtn(){themeBtn.textContent=isDark()?'Light mode':'Dark mode'}
  themeBtn.addEventListener('click',()=>{const next=isDark()?'light':'dark';root.setAttribute('data-theme',next);store.set('sigma.theme',next);syncThemeBtn()});
  if(mq.addEventListener) mq.addEventListener('change',syncThemeBtn);
  new MutationObserver(syncThemeBtn).observe(root,{attributes:true,attributeFilter:['data-theme']});
  syncThemeBtn();

  renderHistory();render();
})();
</script>

</body>
</html>
